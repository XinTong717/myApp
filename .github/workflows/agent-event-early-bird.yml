name: Apply event early-bird fields

on:
  push:
    branches:
      - agent/event-early-bird-list-summary
    paths:
      - .github/workflows/agent-event-early-bird.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/event-early-bird-list-summary
          fetch-depth: 0

      - name: Patch source files
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected snippet not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Submission form: collect optional early-bird price + deadline as a paired field.
          path = 'src/pkg/events/submit/index.tsx'
          replace_once(path,
              "  | 'feeDetail'\n  | 'organizer'",
              "  | 'feeDetail'\n  | 'earlyBirdPrice'\n  | 'organizer'")
          replace_once(path,
              "  const [feeDetail, setFeeDetail] = useState('')\n  const [organizer, setOrganizer] = useState('')",
              "  const [feeDetail, setFeeDetail] = useState('')\n  const [earlyBirdPrice, setEarlyBirdPrice] = useState('')\n  const [earlyBirdDeadline, setEarlyBirdDeadline] = useState('')\n  const [organizer, setOrganizer] = useState('')")
          replace_once(path,
              "    signupDeadlineDate || signupDeadlineTime || isRecurring || recurrencePattern || recurrenceOther.trim() || location.trim() || fee || feeDetail.trim() || organizer.trim() || organizerContact.trim() || officialUrl.trim() ||",
              "    signupDeadlineDate || signupDeadlineTime || isRecurring || recurrencePattern || recurrenceOther.trim() || location.trim() || fee || feeDetail.trim() || earlyBirdPrice.trim() || earlyBirdDeadline || organizer.trim() || organizerContact.trim() || officialUrl.trim() ||")
          replace_once(path,
              "    if (fee === '付费' && !feeDetail.trim()) { Taro.showToast({ title: '请补充付费说明', icon: 'none' }); return }\n    if (!organizer.trim())",
              "    if (fee === '付费' && !feeDetail.trim()) { Taro.showToast({ title: '请补充付费说明', icon: 'none' }); return }\n    if (!!earlyBirdPrice.trim() !== !!earlyBirdDeadline) { Taro.showToast({ title: '早鸟价格和截止日期请一起填写', icon: 'none' }); return }\n    if (!organizer.trim())")
          replace_once(path,
              "        isOnline, location: location.trim(), fee, feeDetail: fee === '付费' ? feeDetail.trim() : '',\n        organizer: organizer.trim(),",
              "        isOnline, location: location.trim(), fee, feeDetail: fee === '付费' ? feeDetail.trim() : '',\n        earlyBirdPrice: fee === '付费' ? earlyBirdPrice.trim() : '',\n        earlyBirdDeadline: fee === '付费' && earlyBirdDeadline ? `${earlyBirdDeadline}T23:59:00${CHINA_TIMEZONE_OFFSET}` : '',\n        organizer: organizer.trim(),")
          replace_once(path,
              "        <SectionTitle text='费用' /><SinglePillSelect options={FEE_OPTIONS} selected={fee} onChange={(value) => { setFee(value); if (value !== '付费') setFeeDetail('') }} />\n        {fee === '付费' && <View style={{ marginBottom: space(4) }}><View style={{ marginBottom: space(2) }}><Text style={{ ...typography.caption, color: palette.subtext }}>补充费用说明</Text></View><FormInputBox focused={focusedField === 'feeDetail'} marginBottom='0'><Input value={feeDetail} placeholder='例如：单次 99 元 / 四次 199 元。' onFocus={() => setFocusedField('feeDetail')} onBlur={() => setFocusedField('')} onInput={(e) => setFeeDetail(e.detail.value)} style={{ ...typography.body, color: palette.text }} /></FormInputBox></View>}",
              "        <SectionTitle text='费用' /><SinglePillSelect options={FEE_OPTIONS} selected={fee} onChange={(value) => { setFee(value); if (value !== '付费') { setFeeDetail(''); setEarlyBirdPrice(''); setEarlyBirdDeadline('') } }} />\n        {fee === '付费' && <>\n          <View style={{ marginBottom: space(4) }}><View style={{ marginBottom: space(2) }}><Text style={{ ...typography.caption, color: palette.subtext }}>补充常规费用说明</Text></View><FormInputBox focused={focusedField === 'feeDetail'} marginBottom='0'><Input value={feeDetail} placeholder='例如：单次 99 元 / 四次 199 元。' onFocus={() => setFocusedField('feeDetail')} onBlur={() => setFocusedField('')} onInput={(e) => setFeeDetail(e.detail.value)} style={{ ...typography.body, color: palette.text }} /></FormInputBox></View>\n          <SectionTitle text='早鸟价格（选填）' />\n          <FormInputBox focused={focusedField === 'earlyBirdPrice'}><Input value={earlyBirdPrice} placeholder='例如：79 元 / 家庭 299 元' onFocus={() => setFocusedField('earlyBirdPrice')} onBlur={() => setFocusedField('')} onInput={(e) => setEarlyBirdPrice(e.detail.value)} style={{ ...typography.body, color: palette.text }} /></FormInputBox>\n          <SectionTitle text='早鸟截止日期（选填）' />\n          <Picker mode='date' value={earlyBirdDeadline} onChange={(e) => setEarlyBirdDeadline(e.detail.value)}><FormInputBox marginBottom={space(2)}><Text style={{ ...typography.body, color: earlyBirdDeadline ? palette.text : palette.muted }}>{earlyBirdDeadline || '选择日期'}</Text></FormInputBox></Picker>\n          <View style={{ marginBottom: space(4) }}><Text style={{ ...typography.micro, color: palette.muted }}>早鸟价格和截止日期需同时填写；截止后活动列表自动显示常规费用。</Text></View>\n        </>}")

          # Submission backend: validate and retain the two new fields.
          path = 'cloudfunctions/appService/handlers/public.js'
          replace_once(path,
              "  fee_category: true,\n  description: true,",
              "  fee_category: true,\n  early_bird_price: true,\n  early_bird_deadline: true,\n  description: true,")
          replace_once(path,
              "'location', 'fee', 'feeDetail', 'organizer', 'organizerContact'",
              "'location', 'fee', 'feeDetail', 'earlyBirdPrice', 'earlyBirdDeadline', 'organizer', 'organizerContact'")
          replace_once(path,
              "  const lengthError = over(cleanData.title, 80) && '活动标题不能超过80字' || over(cleanData.city, 30) && '城市不能超过30字' || over(cleanData.location, 120) && '地点不能超过120字' || over(cleanData.fee, 80) && '费用说明不能超过80字' || over(cleanData.feeDetail, 200) && '费用补充说明不能超过200字' || over(cleanData.organizer, 80)",
              "  const lengthError = over(cleanData.title, 80) && '活动标题不能超过80字' || over(cleanData.city, 30) && '城市不能超过30字' || over(cleanData.location, 120) && '地点不能超过120字' || over(cleanData.fee, 80) && '费用说明不能超过80字' || over(cleanData.feeDetail, 200) && '费用补充说明不能超过200字' || over(cleanData.earlyBirdPrice, 120) && '早鸟价格不能超过120字' || over(cleanData.organizer, 80)")
          replace_once(path,
              "  if (cleanData.signupDeadline) {\n    const deadlineDate = new Date(cleanData.signupDeadline)\n    if (Number.isNaN(deadlineDate.getTime())) return fail(requestId, 'INVALID_SIGNUP_DEADLINE', '报名截止时间格式不正确')\n  }\n  const since =",
              "  if (cleanData.signupDeadline) {\n    const deadlineDate = new Date(cleanData.signupDeadline)\n    if (Number.isNaN(deadlineDate.getTime())) return fail(requestId, 'INVALID_SIGNUP_DEADLINE', '报名截止时间格式不正确')\n  }\n  const hasEarlyBirdPrice = !!cleanData.earlyBirdPrice\n  const hasEarlyBirdDeadline = !!cleanData.earlyBirdDeadline\n  if (hasEarlyBirdPrice !== hasEarlyBirdDeadline) return fail(requestId, 'EARLY_BIRD_PAIR_REQUIRED', '早鸟价格和截止日期请一起填写')\n  if (hasEarlyBirdDeadline && Number.isNaN(new Date(cleanData.earlyBirdDeadline).getTime())) return fail(requestId, 'INVALID_EARLY_BIRD_DEADLINE', '早鸟截止日期格式不正确')\n  const since =")
          replace_once(path,
              "cleanData.fee, cleanData.feeDetail, cleanData.organizer,",
              "cleanData.fee, cleanData.feeDetail, cleanData.earlyBirdPrice, cleanData.earlyBirdDeadline, cleanData.organizer,")
          replace_once(path,
              "location: cleanData.location || '', fee: cleanData.fee || '', feeDetail: cleanData.feeDetail || '', organizer:",
              "location: cleanData.location || '', fee: cleanData.fee || '', feeDetail: cleanData.feeDetail || '', earlyBirdPrice: cleanData.earlyBirdPrice || '', earlyBirdDeadline: cleanData.earlyBirdDeadline || '', organizer:")

          # Admin publish mapping: persist canonical early-bird fields and guard malformed legacy submissions.
          path = 'cloudfunctions/appService/lib/eventPublishPayload.js'
          replace_once(path,
              "    fee_category: feeCategory,\n    description: buildDescription(submission),",
              "    fee_category: feeCategory,\n    early_bird_price: String(submission.earlyBirdPrice || '').trim(),\n    early_bird_deadline: String(submission.earlyBirdDeadline || '').trim(),\n    description: buildDescription(submission),")
          replace_once(path,
              "  const signupDeadline = parseDate(submission.signupDeadline)\n  const officialUrl =",
              "  const signupDeadline = parseDate(submission.signupDeadline)\n  const earlyBirdDeadline = parseDate(submission.earlyBirdDeadline)\n  const earlyBirdPrice = String(submission.earlyBirdPrice || '').trim()\n  const officialUrl =")
          replace_once(path,
              "  if (submission.signupDeadline && !signupDeadline) warnings.push('报名截止时间格式异常，发布前需人工修正')\n  if (submission.isRecurring",
              "  if (submission.signupDeadline && !signupDeadline) warnings.push('报名截止时间格式异常，发布前需人工修正')\n  if (!!earlyBirdPrice !== !!String(submission.earlyBirdDeadline || '').trim()) warnings.push('早鸟价格和截止日期没有成对填写')\n  if (submission.earlyBirdDeadline && !earlyBirdDeadline) warnings.push('早鸟截止日期格式异常，发布前需人工修正')\n  if (earlyBirdDeadline && earlyBirdDeadline.getTime() < Date.now()) warnings.push('早鸟截止日期已过，列表将只显示常规费用')\n  if (submission.isRecurring")
          replace_once(path,
              "  const signupDeadline = parseDate(payload.signup_deadline)\n  const contentSecurityStatus =",
              "  const signupDeadline = parseDate(payload.signup_deadline)\n  const earlyBirdDeadline = parseDate(payload.early_bird_deadline)\n  const contentSecurityStatus =")
          replace_once(path,
              "  if (payload.signup_deadline && !signupDeadline) errors.push('报名截止时间格式异常')\n  if (!String(submission.officialUrl",
              "  if (payload.signup_deadline && !signupDeadline) errors.push('报名截止时间格式异常')\n  if (!!payload.early_bird_price !== !!payload.early_bird_deadline) errors.push('早鸟价格和截止日期需成对填写')\n  if (payload.early_bird_deadline && !earlyBirdDeadline) errors.push('早鸟截止日期格式异常')\n  if (!String(submission.officialUrl")

          # Canonical event reads must include the new fields.
          path = 'cloudfunctions/appService/lib/contentRepo.js'
          replace_once(path,
              "  fee_category: true,\n  description: true,",
              "  fee_category: true,\n  early_bird_price: true,\n  early_bird_deadline: true,\n  description: true,")

          # Shared UI formatting for time, location-card fee and age range.
          path = 'src/pages/events/shared.ts'
          replace_once(path,
              "  fee_category?: string\n  description?: string",
              "  fee_category?: string\n  early_bird_price?: string\n  early_bird_deadline?: string\n  description?: string")
          replace_once(path,
              "export function formatEventTime(event: Pick<EventItem, 'event_type' | 'start_time' | 'end_time' | 'is_recurring' | 'recurrence_pattern'>) {",
              "export function formatEventAgeRange(event: Pick<EventItem, 'min_age_requirement' | 'max_age_requirement'>) {\n  const minText = String(event.min_age_requirement || '').trim()\n  const maxText = String(event.max_age_requirement || '').trim()\n  if ((!minText || minText === '全年龄') && !maxText) return '全年龄'\n  if (!minText || minText === '全年龄') return maxText || '全年龄'\n  if (!maxText) return minText\n  const minMatch = minText.match(/\\d+(?:\\.\\d+)?/)\n  const maxMatch = maxText.match(/\\d+(?:\\.\\d+)?/)\n  if (minMatch && maxMatch) return `${minMatch[0]}-${maxMatch[0]}岁`\n  return `${minText} - ${maxText}`\n}\n\nfunction formatEarlyBirdDeadline(value?: string) {\n  const date = parseEventDate(value)\n  if (!date) return ''\n  return date.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric', timeZone: EVENT_TIMEZONE })\n}\n\nexport function formatEventFee(event: Pick<EventItem, 'fee' | 'early_bird_price' | 'early_bird_deadline'>) {\n  const regularFee = String(event.fee || '').trim() || '免费'\n  const earlyBirdPrice = String(event.early_bird_price || '').trim()\n  const deadline = parseEventDate(event.early_bird_deadline)\n  if (!earlyBirdPrice || !deadline || deadline.getTime() < Date.now()) return regularFee\n  const deadlineText = formatEarlyBirdDeadline(event.early_bird_deadline)\n  return `早鸟 ${earlyBirdPrice}${deadlineText ? `（至 ${deadlineText}）` : ''}｜常规 ${regularFee}`\n}\n\nexport function formatEventTime(event: Pick<EventItem, 'event_type' | 'start_time' | 'end_time' | 'is_recurring' | 'recurrence_pattern'>) {")

          # List cards: replace description preview with the requested four factual lines.
          path = 'src/pages/events/index.tsx'
          replace_once(path,
              "  getEventIconBg,\n  getEventStatusInfo,",
              "  formatEventAgeRange,\n  formatEventFee,\n  formatEventTime,\n  getEventIconBg,\n  getEventStatusInfo,")
          replace_once(path,
              "        const firstLine = (item.description || '').split('\\n').find((line) => line.trim()) || ''\n        const summary = firstLine.length > 40 ? `${firstLine.slice(0, 40)}…` : firstLine",
              "        const locationText = item.is_online ? (item.location || '线上') : (item.location || getEventCity(item) || '待定')\n        const ageRangeText = formatEventAgeRange(item)")
          replace_once(path,
              "              <AppTag text={item.is_online ? '线上' : (getEventCity(item) || '线下')} />\n              {item.min_age_requirement ? <AppTag text={item.min_age_requirement} /> : null}\n              {interestedCount > 0",
              "              {interestedCount > 0")
          replace_once(path,
              "              {summary ? <View className='app-list-card__meta-line'><Text className='text-meta text-color-sub'>{summary}</Text></View> : null}\n              <View className='app-list-card__meta-line'><Text className='text-meta text-color-sub'>费用：{item.fee || '免费'}</Text></View>",
              "              <View className='app-list-card__meta-line'><Text className='text-meta text-color-sub'>时间：{formatEventTime(item)}</Text></View>\n              <View className='app-list-card__meta-line'><Text className='text-meta text-color-sub'>地点：{locationText}</Text></View>\n              <View className='app-list-card__meta-line'><Text className='text-meta text-color-sub'>费用：{formatEventFee(item)}</Text></View>\n              <View className='app-list-card__meta-line'><Text className='text-meta text-color-sub'>参与年龄：{ageRangeText}</Text></View>")

          # Detail page uses the same fee and age semantics as the list.
          path = 'src/pages/event-detail/index.tsx'
          replace_once(path,
              "import { EVENT_TYPE_LABELS, formatEventTime, getEventIconBg, getEventStatusInfo } from '../events/shared'",
              "import { EVENT_TYPE_LABELS, formatEventAgeRange, formatEventFee, formatEventTime, getEventIconBg, getEventStatusInfo } from '../events/shared'")
          replace_once(path,
              "      <AppInfoRow label='费用' value={event.fee || '免费'} />\n      <AppInfoRow label='组织者'",
              "      <AppInfoRow label='费用' value={formatEventFee(event)} />\n      <AppInfoRow label='参与年龄' value={formatEventAgeRange(event)} />\n      <AppInfoRow label='组织者'")

          # Keep service-level type declarations aligned.
          path = 'src/types/domain.ts'
          replace_once(path,
              "  fee_category?: string\n  description?: string",
              "  fee_category?: string\n  early_bird_price?: string\n  early_bird_deadline?: string\n  description?: string")

          # Preserve the fields in future CSV migrations too.
          path = 'scripts/prepare-content-migration.cjs'
          replace_once(path,
              "    fee: cleanText(row.fee),\n    status:",
              "    fee: cleanText(row.fee),\n    early_bird_price: cleanText(row.early_bird_price),\n    early_bird_deadline: cleanText(row.early_bird_deadline),\n    status:")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript and action manifest
        run: |
          npm run typecheck
          npm run check:actions

      - name: Commit source changes
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pkg/events/submit/index.tsx src/pages/events/index.tsx src/pages/events/shared.ts src/pages/event-detail/index.tsx src/types/domain.ts cloudfunctions/appService/handlers/public.js cloudfunctions/appService/lib/eventPublishPayload.js cloudfunctions/appService/lib/contentRepo.js scripts/prepare-content-migration.cjs
          git commit -m "feat: add early bird event pricing"
          git push origin HEAD:agent/event-early-bird-list-summary
